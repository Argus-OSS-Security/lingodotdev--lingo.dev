name: Lint PR

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   pull_request:
#     types:
#       - opened
#       - edited
#       - synchronize
# 
jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
